name: Avisar builds de Codemagic (WhatsApp)

# Manda el WhatsApp de "tu build terminó" —salga bien o salga mal— preguntándole
# a Codemagic, en vez de depender de que el `codemagic.yaml` de cada repo de app
# llegue vivo hasta su paso de notificar. Un build que revienta antes de ese paso
# no avisaba a nadie; ya pasó con un build de Mac que falló en silencio.
#
# El cron PIDE cada 5 minutos y GitHub da lo que quiere: en este repo las
# corridas reales llegan cada 2 a 12 horas —el planificador descarta casi todos
# los disparos de alta frecuencia—. Por eso LOOKBACK_MIN es de un día entero y
# no de las 3 h que tenía: con una ventana más corta que el hueco entre corridas,
# el build que terminaba dentro del hueco no se avisaba tarde, se perdía. Los
# repetidos los corta el registro `buildNotifications/{buildId}` en Firestore,
# así que la ventana ancha solo puede recuperar avisos, nunca duplicarlos.
#
# `repository_dispatch` es la vía para que el aviso salga AL MOMENTO en vez de
# esperar al cron: un webhook de Codemagic ("build finished") que pase por n8n y
# pegue en
#   POST /repos/{owner}/{repo}/dispatches  {"event_type":"codemagic-build-finished"}
# dispara esta misma corrida en segundos. Mientras eso no esté conectado, el cron
# sigue siendo la red de seguridad.
on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [codemagic-build-finished]
  workflow_dispatch:

concurrency:
  group: codemagic-builds-notify
  # Sin cancelar la corrida en curso: matarla a media notificación dejaría un
  # build avisado a unos destinatarios y no a otros.
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_GCP_DEV }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet requests

      - name: Avisar builds terminados
        env:
          GCP_PROJECT: sozu-admin-dev
          LOOKBACK_MIN: "1440"
        run: |
          # Token de la cuenta de Firebase (lee y escribe Firestore por REST).
          FIRESTORE_TOKEN="$(gcloud auth print-access-token)"
          export FIRESTORE_TOKEN
          # Útil cuando falta un permiso: dice a quién hay que dárselo.
          echo "Cuenta de servicio del sync: $(gcloud config get-value account 2>/dev/null)"

          secret() {
            # Devuelve vacío si el secret no existe: el script se salta solo.
            gcloud secrets versions access latest --secret="$1" --project=sozu-admin-dev 2>/dev/null || true
          }

          # Si el secret todavía no existe, el script lo dice y termina bien: no
          # tiene caso pintar de rojo este workflow cada 5 minutos hasta que se cree.
          CODEMAGIC_TOKEN="$(secret DASHBOARD_CODEMAGIC_TOKEN)"
          export CODEMAGIC_TOKEN


          python ci/codemagic_builds_notify.py
