name: Deploy to Firebase Hosting (Dev)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_GCP_DEV }}

      - name: Get secrets from GCP Secret Manager
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |
            VITE_FIREBASE_API_KEY:sozu-admin-dev/DASHBOARD_FIREBASE_API_KEY
            VITE_FIREBASE_AUTH_DOMAIN:sozu-admin-dev/DASHBOARD_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_PROJECT_ID:sozu-admin-dev/DASHBOARD_FIREBASE_PROJECT_ID
            VITE_FIREBASE_STORAGE_BUCKET:sozu-admin-dev/DASHBOARD_FIREBASE_STORAGE_BUCKET
            VITE_FIREBASE_MESSAGING_SENDER_ID:sozu-admin-dev/DASHBOARD_FIREBASE_MESSAGING_SENDER_ID
            VITE_FIREBASE_APP_ID:sozu-admin-dev/DASHBOARD_FIREBASE_APP_ID
            VITE_GITHUB_TOKEN:sozu-admin-dev/DASHBOARD_GITHUB_TOKEN

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ env.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ env.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ env.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ env.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ env.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ env.VITE_FIREBASE_APP_ID }}
          VITE_GITHUB_TOKEN: ${{ env.VITE_GITHUB_TOKEN }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore Rules
        run: firebase deploy --only firestore:rules --project sozu-admin-dev

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_GCP_DEV }}
          projectId: sozu-admin-dev
          target: sozu-dashboard-dev
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
