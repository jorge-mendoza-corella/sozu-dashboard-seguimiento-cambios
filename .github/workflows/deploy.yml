name: Deploy to Firebase Hosting (Dev)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_GCP_DEV }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get secrets from Secret Manager
        run: |
          VITE_FIREBASE_API_KEY=$(gcloud secrets versions access latest --secret=DASHBOARD_FIREBASE_API_KEY --project=sozu-admin-dev)
          echo "VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY" >> $GITHUB_ENV

          VITE_FIREBASE_AUTH_DOMAIN=$(gcloud secrets versions access latest --secret=DASHBOARD_FIREBASE_AUTH_DOMAIN --project=sozu-admin-dev)
          echo "VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN" >> $GITHUB_ENV

          VITE_FIREBASE_PROJECT_ID=$(gcloud secrets versions access latest --secret=DASHBOARD_FIREBASE_PROJECT_ID --project=sozu-admin-dev)
          echo "VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID" >> $GITHUB_ENV

          VITE_FIREBASE_STORAGE_BUCKET=$(gcloud secrets versions access latest --secret=DASHBOARD_FIREBASE_STORAGE_BUCKET --project=sozu-admin-dev)
          echo "VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET" >> $GITHUB_ENV

          VITE_FIREBASE_MESSAGING_SENDER_ID=$(gcloud secrets versions access latest --secret=DASHBOARD_FIREBASE_MESSAGING_SENDER_ID --project=sozu-admin-dev)
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID" >> $GITHUB_ENV

          VITE_FIREBASE_APP_ID=$(gcloud secrets versions access latest --secret=DASHBOARD_FIREBASE_APP_ID --project=sozu-admin-dev)
          echo "VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID" >> $GITHUB_ENV

          VITE_GITHUB_TOKEN=$(gcloud secrets versions access latest --secret=DASHBOARD_GITHUB_TOKEN --project=sozu-admin-dev)
          echo "VITE_GITHUB_TOKEN=$VITE_GITHUB_TOKEN" >> $GITHUB_ENV

          VITE_GITHUB_REVIEWER_TOKEN=$(gcloud secrets versions access latest --secret=DASHBOARD_GITHUB_REVIEWER_TOKEN --project=sozu-admin-dev)
          echo "VITE_GITHUB_REVIEWER_TOKEN=$VITE_GITHUB_REVIEWER_TOKEN" >> $GITHUB_ENV

          echo "VITE_GITHUB_DOCS_TOKEN=${{ secrets.DASHBOARD_GITHUB_DOCS_TOKEN }}" >> $GITHUB_ENV

          # Token de Codemagic (builds de apps desde el dashboard). Si el secret
          # no existe todavía, no rompe el build: la UI de builds queda oculta.
          VITE_CODEMAGIC_TOKEN=$(gcloud secrets versions access latest --secret=DASHBOARD_CODEMAGIC_TOKEN --project=sozu-admin-dev 2>/dev/null || true)
          echo "VITE_CODEMAGIC_TOKEN=$VITE_CODEMAGIC_TOKEN" >> $GITHUB_ENV


      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy Firestore rules
        # google-github-actions/auth ya exportó GOOGLE_APPLICATION_CREDENTIALS;
        # firebase-tools lo usa para autenticarse de forma no interactiva.
        # No bloquea el deploy de hosting: si el service account no tiene permisos
        # (serviceusage.services.get / firebaserules.admin), despliega las reglas a mano.
        continue-on-error: true
        run: npx -y firebase-tools@latest deploy --only firestore:rules --project sozu-admin-dev --non-interactive

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_GCP_DEV }}
          projectId: sozu-admin-dev
          target: sozu-dashboard-dev
          channelId: live

      - name: Notificar deploy listo (WhatsApp)
        if: success()
        # Si n8n no responde, no tumbar el status del deploy (ya quedó publicado).
        continue-on-error: true
        env:
          ENVIRONMENT: DEV
          FIRESTORE_PROJECT: sozu-admin-dev
        run: |
          ACTOR="${{ github.actor }}"
          # El service account ya está autenticado (paso "Authenticate to Google Cloud"),
          # así que aquí no hace falta firmar el JWT a mano como en
          # ci-templates/notify-pr-dev.yml.
          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          # --- Helpers de lectura por REST (el token del service account ignora
          # las reglas de seguridad) --------------------------------------------
          FS="https://firestore.googleapis.com/v1/projects/${FIRESTORE_PROJECT}/databases/(default)/documents"
          leer() { curl -s --max-time 20 -H "Authorization: Bearer $ACCESS_TOKEN" "${FS}/$1"; }
          campo() { printf '%s' "$1" | jq -r --arg f "$2" '.fields[$f].stringValue // empty'; }
          # `enabled` ausente = prendido. Ojo: `// empty` no sirve para booleanos
          # (jq trata `false` como vacío), por eso se mira el tipo del campo.
          prendido() { printf '%s' "$1" | jq -r 'if (.fields.enabled | type) == "object" then (.fields.enabled.booleanValue | tostring) else "" end'; }

          # --- Empresa dueña del repo ------------------------------------------
          # repos/{owner__repo}.projectId -> projects/{projectId}.clientId
          #
          # TODO ES POR EMPRESA O NO SE MANDA NADA. Ya no hay configuración
          # global (`settings/notifications`, `secrets/whatsapp`) ni cascada que
          # herede de ella: con un default global, la empresa que todavía no
          # configuraba sus avisos los recibía por el número de otra, y su
          # webhook podía acabar llevándose una llave que no era suya. Sin nada
          # que heredar, esos dos problemas desaparecen. Un repo cuyo proyecto
          # no tiene empresa asignada simplemente no notifica, y aquí se dice.
          REPO_ID="${GITHUB_REPOSITORY/\//__}"
          CLIENT_ID=""
          PROJECT_ID="$(campo "$(leer "repos/${REPO_ID}")" projectId)"
          if [ -z "$PROJECT_ID" ]; then
            echo "El repo '${GITHUB_REPOSITORY}' no está dado de alta en el dashboard (repos/${REPO_ID}), así que no se sabe de qué empresa es; se omite la notificación."
            exit 0
          fi
          CLIENT_ID="$(campo "$(leer "projects/${PROJECT_ID}")" clientId)"
          if [ -z "$CLIENT_ID" ]; then
            echo "El proyecto '${PROJECT_ID}' no tiene empresa asignada; se omite la notificación. Asígnale una en el dashboard → Proyectos."
            exit 0
          fi
          echo "Empresa dueña del repo: '${CLIENT_ID}' (proyecto '${PROJECT_ID}')."

          # --- Configuración de la empresa (la única que hay) -------------------
          C_DOC="$(leer "clients/${CLIENT_ID}/private/notifications")"
          C_KEY="$(campo "$(leer "clients/${CLIENT_ID}/private/whatsappSecret")" apiKey)"
          if [ -n "$C_KEY" ]; then echo "::add-mask::${C_KEY}"; fi

          WA_INSTANCE="$(campo "$C_DOC" instance)"
          WA_WEBHOOK="$(campo "$C_DOC" webhookUrl)"
          WA_APIKEY="$C_KEY"

          # `enabled: false` apaga los avisos de la empresa; ausente = prendido.
          if [ "$(prendido "$C_DOC")" = "false" ]; then
            echo "La empresa '${CLIENT_ID}' tiene apagadas las notificaciones de WhatsApp; no se envía nada."
            exit 0
          fi
          # Se enumera lo que falta, no un genérico: quien lea el log tiene que
          # saber qué campo ir a capturar. El webhook y la apikey ya no pueden
          # venir de dueños distintos, así que no hay nada que emparejar.
          # (con `if`, no con `[ ... ] && ...`: el step corre bajo `set -e` y una
          # lista `&&` cuyo test falla tumbaría el step sin notificar nada.)
          FALTAN=""
          if [ -z "$WA_INSTANCE" ]; then FALTAN="${FALTAN}instancia, "; fi
          if [ -z "$WA_WEBHOOK" ];  then FALTAN="${FALTAN}webhook, ";   fi
          if [ -z "$WA_APIKEY" ];   then FALTAN="${FALTAN}apikey, ";    fi
          if [ -n "$FALTAN" ]; then
            echo "La empresa '${CLIENT_ID}' no tiene ${FALTAN%, } de WhatsApp; se omite la notificación. Captúralo en el dashboard → Configuración → Notificaciones."
            exit 0
          fi

          # Teléfono (10 dígitos) guardado para este usuario de GitHub en Firestore.
          PHONE="$(curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://firestore.googleapis.com/v1/projects/${FIRESTORE_PROJECT}/databases/(default)/documents/contributors/${ACTOR}" \
            | jq -r '.fields.telefonoWhatsapp.stringValue // empty')"
          if [ -z "$PHONE" ]; then
            echo "Sin teléfono guardado para '$ACTOR' en contributors; se omite la notificación."
            exit 0
          fi
          PAYLOAD="$(jq -n --arg tel "+521${PHONE}" --arg inst "$WA_INSTANCE" \
            --arg msg "Ha quedado listo tu deploy en ${ENVIRONMENT} del repo ${GITHUB_REPOSITORY##*/}, puedes revisar" \
            '{tipo:"wa",telefono:$tel,mensajeWA:$msg,instanciaWA:$inst}')"
          # Tres intentos: un webhook que no responde a la primera dejaba el
          # aviso perdido en silencio.
          for intento in 1 2 3; do
            CODE="$(curl -s -o /tmp/n8n.out -w '%{http_code}' --max-time 20 \
              -X POST "$WA_WEBHOOK" -H "apikey: $WA_APIKEY" \
              -H "Content-Type: application/json" -d "$PAYLOAD" || echo 000)"
            # n8n contesta 200 aunque el mensaje NO se haya entregado: acepta la
            # peticion y mete el fallo de la instancia de WhatsApp en el cuerpo. Con
            # solo mirar el codigo HTTP, esto cantaba "Notificado" mientras Evolution
            # respondia "Connection Closed" —la sesion caida— y nadie recibia nada
            # durante dias sin una sola alarma. El cuerpo tambien decide.
            FALLA="$(jq -r 'if .datos_validos == false then (.error_validacion // "n8n rechazo los datos") elif (.error // null) != null then (.error | if type == "object" then (.message // tostring) else tostring end) else empty end' /tmp/n8n.out 2>/dev/null || true)"
            case "$CODE" in 2*) if [ -z "$FALLA" ]; then echo "Notificado $ACTOR"; exit 0; fi ;; esac
            echo "Intento ${intento} fallo (HTTP ${CODE}${FALLA:+ — n8n: ${FALLA:0:200}}): $(cat /tmp/n8n.out | head -c 300)"
            sleep $((intento * 5))
          done
          echo "::warning::No se pudo notificar el deploy tras 3 intentos"
