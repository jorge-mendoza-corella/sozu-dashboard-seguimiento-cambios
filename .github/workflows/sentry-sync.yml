name: Monitoreo Sentry

# Resumen de errores de cada proyecto de Sentry (org `sozu-lh`) en
# `sentry/{projectSlug}`, que es lo que pinta la pestaña Monitoreo.
#
# El token de Sentry lee los errores de toda la organización: se queda aquí y
# el navegador solo ve el resumen de Firestore.
#
# Igual que el monitor de WhatsApp: el cron pide cada 15 minutos, pero GitHub
# descarta muchos de esos disparos en este repo. Quien mantiene el dato fresco
# es la pestaña abierta: si lo que hay tiene más de 10 min, lanza este workflow
# por `workflow_dispatch`. El cron queda de respaldo.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: sentry-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_GCP_DEV }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet requests

      - name: Sync
        env:
          GCP_PROJECT: sozu-admin-dev
          # Respaldo: si no está en Secret Manager, se toma del secreto del repo.
          SENTRY_AUTH_TOKEN_GH: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          FIRESTORE_TOKEN="$(gcloud auth print-access-token)"
          export FIRESTORE_TOKEN

          SENTRY_AUTH_TOKEN="$(gcloud secrets versions access latest --secret=SENTRY_AUTH_TOKEN --project=sozu-admin-dev 2>/dev/null || true)"
          SENTRY_AUTH_TOKEN="${SENTRY_AUTH_TOKEN:-$SENTRY_AUTH_TOKEN_GH}"
          [ -n "$SENTRY_AUTH_TOKEN" ] && echo "::add-mask::$SENTRY_AUTH_TOKEN"
          export SENTRY_AUTH_TOKEN

          python ci/sentry_sync.py
