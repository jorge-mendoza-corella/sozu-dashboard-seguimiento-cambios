name: Monitor conexión WhatsApp (Evolution API)

# Le pregunta a Evolution API si la instancia de WhatsApp de cada empresa sigue
# conectada y lo deja en `whatsappStatus/{clientId}`. La barra del dashboard lo
# pinta: verde = conectado, rojo = desconectado (y desde cuándo).
#
# Sin esto, una sesión caída solo se notaba porque los avisos dejaban de llegar:
# n8n acepta la petición igual y nadie se entera del por qué.
#
# El cron PIDE cada 5 minutos, pero en este repo GitHub descarta casi todos esos
# disparos (las corridas reales llegan cada varias horas). Quien mantiene el dato
# fresco es el dashboard: si lo que hay tiene más de 6 min, la pestaña abierta
# lanza este workflow por `workflow_dispatch`. El cron queda de respaldo.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: whatsapp-status-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_GCP_DEV }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet requests

      - name: Sync
        env:
          GCP_PROJECT: sozu-admin-dev
          # Respaldo: si no están en Secret Manager, se toman de los secretos del repo.
          EVOLUTION_URL_GH: ${{ secrets.EVOLUTION_URL }}
          EVOLUTION_API_KEY_GH: ${{ secrets.EVOLUTION_API_KEY }}
        run: |
          FIRESTORE_TOKEN="$(gcloud auth print-access-token)"
          export FIRESTORE_TOKEN

          secret() {
            gcloud secrets versions access latest --secret="$1" --project=sozu-admin-dev 2>/dev/null || true
          }
          EVOLUTION_URL="$(secret EVOLUTION_URL)"
          EVOLUTION_API_KEY="$(secret EVOLUTION_API_KEY)"
          EVOLUTION_URL="${EVOLUTION_URL:-$EVOLUTION_URL_GH}"
          EVOLUTION_API_KEY="${EVOLUTION_API_KEY:-$EVOLUTION_API_KEY_GH}"
          [ -n "$EVOLUTION_API_KEY" ] && echo "::add-mask::$EVOLUTION_API_KEY"
          export EVOLUTION_URL EVOLUTION_API_KEY

          python ci/whatsapp_status_sync.py
