name: Sync consumo de GitHub Actions

# Cuánto lleva gastado la cuenta en minutos de Actions.
#
# Cada seis horas: el cupo se consume a lo largo del mes y el número no cambia
# de un minuto a otro. Lo mira solo quien administra, así que tampoco hace falta
# que esté fresco al segundo.
#
# Los repos públicos no consumen cuota; lo que se factura son los privados.
on:
  schedule:
    - cron: "25 */6 * * *"
  workflow_dispatch:

concurrency:
  group: github-billing-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_GCP_DEV }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet requests

      - name: Sync
        env:
          GCP_PROJECT: sozu-admin-dev
        run: |
          FIRESTORE_TOKEN="$(gcloud auth print-access-token)"
          export FIRESTORE_TOKEN

          secret() {
            gcloud secrets versions access latest --secret="$1" --project=sozu-admin-dev 2>/dev/null || true
          }

          # PAT con scope `user` de la cuenta que paga. Va como secreto propio y
          # no se reutiliza el token de CI: ese no tiene por qué poder leer la
          # facturación de nadie.
          GH_BILLING_TOKEN="$(secret DASHBOARD_GH_BILLING_TOKEN)"
          GH_BILLING_USER="$(secret DASHBOARD_GH_BILLING_USER)"
          export GH_BILLING_TOKEN
          export GH_BILLING_USER="${GH_BILLING_USER:-jorgeIMendoza}"

          python ci/github_billing_sync.py
