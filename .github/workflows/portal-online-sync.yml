name: Sync conectados ahora (portal_sesiones)

# Quién está usando las apps en este momento.
#
# Va en su propio workflow y no dentro del sync de descargas porque la cadencia
# es otra: aquel corre cada tres horas —un total de descargas no cambia de un
# minuto a otro— y esto dice "ahora", así que a las tres horas ya no dice nada.
# Es una sola llamada a una RPC y una escritura por app: dura segundos.
#
# El repo es público, así que estos minutos de Actions no se facturan.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: portal-online-sync
  cancel-in-progress: true # si se encima, la corrida nueva trae el dato bueno

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_GCP_DEV }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        # `pyjwt[crypto]` para firmar el token de Analytics: el acumulado de hoy
        # sale de GA4, y esa API no acepta el token de gcloud.
        run: pip install --quiet "pyjwt[crypto]" requests

      - name: Sync
        env:
          GCP_PROJECT: sozu-admin-dev
        run: |
          FIRESTORE_TOKEN="$(gcloud auth print-access-token)"
          export FIRESTORE_TOKEN

          secret() {
            gcloud secrets versions access latest --secret="$1" --project=sozu-admin-dev 2>/dev/null || true
          }

          # Los mismos secretos propios del resto de puentes: apuntan a la base
          # de PRODUCCIÓN, que es la que usan las apps de verdad.
          SUPABASE_URL="$(secret DASHBOARD_SUPABASE_URL)"
          SUPABASE_SERVICE_ROLE_KEY="$(secret DASHBOARD_SUPABASE_SERVICE_ROLE_KEY)"
          export SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY

          python ci/portal_online_sync.py

          # Las instalaciones de HOY, sumadas de a poco. Ninguna fuente sabe
          # decir cuántas lleva el día en curso —las tiendas publican al día
          # siguiente y el reporte diario de GA4 tampoco trae hoy—, así que se
          # arma sumando la ventana de Realtime en cada pasada. La ventana es
          # igual al cron (10 min) para no contar dos veces al mismo.
          python ci/ga4_hoy_acumulado.py
