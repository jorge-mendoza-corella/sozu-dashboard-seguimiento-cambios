name: Sync partidos de la Selección

# Calendario de la Selección Mexicana para GeorgIA (escena del fut): el día 1
# de cada mes lee los próximos partidos de México (API pública de ESPN) y los
# deja en Firestore `agente_partidos/seleccion`. Nadie los captura a mano.
on:
  schedule:
    - cron: "0 13 1 * *" # día 1 de cada mes, 7:00 hora del centro de México
  workflow_dispatch:

concurrency:
  group: seleccion-partidos-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_GCP_DEV }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet requests

      - name: Sync
        env:
          GCP_PROJECT: sozu-admin-dev
        run: |
          FIRESTORE_TOKEN="$(gcloud auth print-access-token)"
          export FIRESTORE_TOKEN
          python ci/seleccion_partidos_sync.py
