name: Sync estado de tiendas (Play / App Store)

# Vuelca a Firestore el estado de publicación de cada app para verlo en el
# dashboard sin entrar a las consolas:
#   · Google Play — tracks (interno / cerrada / abierta / producción)
#   · App Store Connect — estado de revisión de la versión y builds
on:
  schedule:
    - cron: "*/15 * * * *" # cada 15 min
  workflow_dispatch: # botón "actualizar" del dashboard

concurrency:
  group: play-tracks-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_GCP_DEV }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet "pyjwt[crypto]" requests

      - name: Sync
        env:
          GCP_PROJECT: sozu-admin-dev
        run: |
          # Token de la cuenta de Firebase (escribe Firestore por REST).
          FIRESTORE_TOKEN="$(gcloud auth print-access-token)"
          export FIRESTORE_TOKEN
          # Útil cuando falta un permiso: dice a quién hay que dárselo.
          echo "Cuenta de servicio del sync: $(gcloud config get-value account 2>/dev/null)"

          secret() {
            # Devuelve vacío si el secret no existe: cada script se salta solo.
            gcloud secrets versions access latest --secret="$1" --project=sozu-admin-dev 2>/dev/null || true
          }

          # --- Google Play ---
          PLAY_SA_JSON="$(secret DASHBOARD_PLAY_SERVICE_ACCOUNT)"
          export PLAY_SA_JSON
          python ci/play_tracks_sync.py

          # --- App Store Connect ---
          ASC_KEY_ID="$(secret DASHBOARD_ASC_KEY_ID)"
          ASC_ISSUER_ID="$(secret DASHBOARD_ASC_ISSUER_ID)"
          ASC_PRIVATE_KEY="$(secret DASHBOARD_ASC_PRIVATE_KEY)"
          export ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY
          python ci/appstore_status_sync.py

          # --- Canales de Firebase Hosting (drafts pendientes de publicar) ---
          # HOSTING_COMPARE es el respaldo cuando la cuenta de servicio no tiene
          # permiso sobre el sitio: compara el HTML del draft contra el de producción.
          # Token del endpoint /api/estado del sitio de avances (fuente oficial
          # del "hay borrador pendiente"). Sin él se usa solo la comparación.
          AVANCES_ESTADO_TOKEN="$(secret DASHBOARD_AVANCES_ESTADO_TOKEN)"
          export AVANCES_ESTADO_TOKEN
          HOSTING_SITES=sozu-avances \
          HOSTING_COMPARE="sozu-avances|https://avances.sozu.com|https://sozu-avances--draft-u1wqsh7o.web.app" \
            python ci/hosting_channels_sync.py

          # --- Versión que sirve cada front (repos con frontUrl) ---
          # El navegador no puede leer esos sitios (no mandan CORS); aquí sí.
          python ci/front_versions_sync.py
